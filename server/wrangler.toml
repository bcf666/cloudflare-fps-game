name = "fps-game-server"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# 静态资源（前端构建产物）
[assets]
directory = "../client/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Durable Object 绑定：把 RoomDO 类暴露为 env.ROOM
[[durable_objects.bindings]]
name = "ROOM"
class_name = "RoomDO"

# Durable Object 迁移（首次部署声明新建类）
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO"]
