name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy to Pages (with _worker.js + DO)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install server dependencies (for typecheck)
        working-directory: server
        run: npm ci || npm install

      - name: Install client dependencies
        working-directory: client
        run: npm ci || npm install

      - name: Build client (vite + esbuild _worker.js)
        working-directory: client
        run: npm run build

      - name: Deploy to Cloudflare Pages (with DO migration)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: client
          command: pages deploy dist --project-name=bcf --branch=main --config wrangler.toml
